<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photo gallery for the XQ7 Apartments investment opportunity.">
  <title>XQ7 Apartments Gallery</title>
  <style>
    :root { --navy: #0a1a3e; --yellow: #f7c948; --white: #ffffff; --surface: #f4f6fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: var(--surface); color: var(--navy); font-family: Inter, Arial, sans-serif; line-height: 1.55; }
    main { display: grid; min-height: 100vh; place-items: center; padding: 2rem; }
    .gallery { width: min(760px, 100%); padding: clamp(2rem, 7vw, 5rem); background: var(--navy); color: var(--white); text-align: center; }
    .eyebrow { margin: 0 0 1rem; color: var(--yellow); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; }
    h1 { margin: 0; font-size: clamp(2.25rem, 7vw, 4.5rem); line-height: 1.05; }
    p { margin: 1.5rem auto 0; max-width: 480px; }
    .status { display: inline-block; margin-top: 2rem; padding: 0.65rem 1rem; border: 1px solid var(--yellow); color: var(--yellow); font-size: 0.8rem; font-weight: 800; letter-spacing: 0.1em; }
    a { display: inline-block; margin-top: 2rem; color: var(--white); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <section class="gallery">
      <p class="eyebrow">XQ7 APARTMENTS | M5 3FP</p>
      <h1>Property gallery</h1>
      <p>Photographs of the apartment and its views will be available here soon.</p>
      <span class="status">Coming soon</span>
      <br>
      <a href="../">Return to investment details</a>
    </section>
  </main>
</body>
</html>
